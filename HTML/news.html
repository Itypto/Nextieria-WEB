<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/news.css">
    <link rel="icon" type="image/x-icon" href="https://nextieria.ddns.net:45/Downloads/Other/NextieriaN.ico?v=a3bd85f6">
    <link rel="stylesheet" href="../assets/css/footer.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <script src="./js/navbar.js" defer></script>
    <script src="./js/footer.js" defer></script>
    <title>Nextieria | News</title>
</head>
<body>

    <div id="main-nav"></div>

<div class="news-wrapper">
    <div class="news-grid" id="news-container">
        <a href="/news/mobile-60-fps" class="news-item">
            <img src="https://nextieria.ddns.net:45/Downloads/Images/Website/News/mobile60fpsheaderimg.jpg" alt="News">
            <div class="news-info">
                <div class="news-date">SEP 26, 2026</div>
                <div class="news-title">60FPS OPTION FOR MOBILE!</div>
            </div>
        </a>
    </div>
</div>
<div id="footer"></div>

<script>
    const items = document.querySelectorAll('#news-container .news-item');
    let largeBlockCount = 0;

    items.forEach((item, index) => {
        if (index === 0) {
            item.classList.add('hero-banner');
            return;
        }

        const patternIndex = (index - 1) % 6;

        if (patternIndex === 0 || patternIndex === 1) {
            if (patternIndex === 0) {
                largeBlockCount++;
            }
            
            const isEvenBlock = largeBlockCount % 2 === 0;
            
            if (patternIndex === 0) {
                item.classList.add('card', 'card-large', isEvenBlock ? 'card-large-right' : 'card-large-left');
            } else {
                item.classList.add('card', 'card-large', isEvenBlock ? 'card-large-left' : 'card-large-right');
            }
        } else {
            item.classList.add('card', 'card-small');
        }
    });
</script>

</body>
</html>
