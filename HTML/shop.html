<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nextieria | Shop</title>
    <link rel="icon" type="image/x-icon" href="https://nextieria.ddns.net:45/Downloads/Other/NextieriaN.ico?v=a3bd85f6">
    <link rel="stylesheet" href="https://components.unrealengine.com/fonts/inter/index.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="../assets/css/footer.css">
    <script src="./js/navbar.js" defer></script>
    <script src="./js/footer.js" defer></script>
    <style>
        @font-face {
            font-family: 'LuckiestGuy';
            src: url('https://nextieria.ddns.net:45/Downloads/Fonts/LuckiestGuy.ttf') format('truetype');
        }
        @font-face { 
            font-family: 'NewFN'; 
            src: url('https://nextieria.ddns.net:45/Downloads/Fonts/NewFn.ttf') format('truetype'); 
        }

        body {
            margin: 0;
            padding: 0;
            background-image: url('https://nextieria.ddns.net:45/Downloads/Images/OGshop.png');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            font-family: 'NewFN', cursive;
            color: white;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .shop-container {
            display: flex;
            padding: 20px 40px 40px 40px;
            gap: 50px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 140px;
        }

        .featured-section {
            flex: 1.4;
            display: flex;
            flex-direction: column;
        }

        .daily-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .section-header {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, #51607a 0%, #3e4c63 100%);
            padding: 6px 14px;
            margin-bottom: 18px;
            height: 48px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .section-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 250px;
            height: 100%;
            background: linear-gradient(180deg, #6c7c9c 0%, #566785 100%);
            clip-path: polygon(0 0, calc(100% - 35px) 0, 100% 100%, 0 100%);
            z-index: 1;
        }

        .daily-section .section-header::before {
            width: 220px;
        }

        .section-title {
            position: relative;
            z-index: 2;
            font-size: 2.3rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #cfd6df;
            margin: 0;
            font-family: 'LuckiestGuy', cursive;
        }

        .section-timer {
            position: relative;
            z-index: 2;
            font-size: 1.8rem;
            color: #ffffff;
        }

        .featured-grid {
            display: flex;
            gap: 20px;
            align-items: stretch;
            width: 100%;
        }

        .featured-grid .item-card {
            flex: 1;
            min-height: 560px;
        }

        .daily-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
        }

        .daily-grid .item-card {
            height: 270px;
        }

        .item-card {
            background-color: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .rarity-Common { background-color: rgba(128, 128, 128, 0.5); border-color: rgba(160, 160, 160, 0.4); }
        .rarity-Uncommon { background-color: rgba(46, 204, 113, 0.5); border-color: rgba(46, 204, 113, 0.4); }
        .rarity-Rare { background-color: rgba(0, 136, 255, 0.5); border-color: rgba(0, 136, 255, 0.4); }
        .rarity-Epic { background-color: rgba(179, 57, 255, 0.5); border-color: rgba(179, 57, 255, 0.4); }
        .rarity-Legendary { background-color: rgba(255, 159, 67, 0.5); border-color: rgba(255, 159, 67, 0.4); }
        .rarity-MARVEL-SERIES { background-color: rgba(200, 0, 0, 0.7); border-color: rgba(255, 0, 0, 0.5); }

        .item-image {
            width: 100%;
            flex: 1;
            object-fit: contain;
            padding: 15px;
            box-sizing: border-box;
            min-height: 0;
            transition: opacity 0.3s ease;
        }

        .item-details {
            width: 100%;
            padding: 12px 8px;
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
            min-height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'NewFN', cursive;
        }

        .item-name {
            font-size: 16px;
            line-height: 1.2;
            word-break: break-word;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            text-shadow: 1px 1px 3px black;
            transition: opacity 0.3s ease;
            font-family: 'NewFN', cursive;
        }

        .price-container {
            width: 100%;
            background-color: #09224a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 0;
            font-size: 20px;
            box-sizing: border-box;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-family: 'NewFN', cursive;
        }

        .vbucks-icon { width: 22px; height: 22px; margin-left: 8px; }

        .card-dots {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 5;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 8px;
            border-radius: 10px;
        }

        .card-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.3);
            transition: background-color 0.3s ease, transform 0.3s ease;
            cursor: pointer;
        }

        .card-dot.active {
            background-color: #ffffff;
            transform: scale(1.2);
        }

        @media (max-width: 1100px) {
            .shop-container {
                flex-direction: column;
                padding: 20px;
                gap: 30px;
            }
            .featured-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            }
            .featured-grid .item-card {
                min-height: 420px;
            }
            .daily-grid {
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
                gap: 15px;
            }
            .daily-grid .item-card {
                height: 260px;
            }
        }
    </style>
</head>
<body>
    <div id="main-nav"></div>

    <div class="shop-container" id="shop-main-container">
        <div class="featured-section">
            <div class="section-header">
                <span class="section-title">FEATURED</span>
                <span id="weekly-timer" class="section-timer" translate="no"></span>
            </div>
            <div id="featured-grid" class="featured-grid"></div>
        </div>

        <div class="daily-section">
            <div class="section-header">
                <span class="section-title">DAILY</span>
                <span id="daily-timer" class="section-timer" translate="no"></span>
            </div>
            <div id="daily-grid" class="daily-grid"></div>
        </div>
    </div>

    <script>
        let nextDailyTime = null;
        let nextFeaturedTime = null;
        let cardIntervals = [];

        function fetchShop() {
            fetch('https://nextieria.ddns.net:81/shop/code')
                .then(res => res.json())
                .then(data => {
                    cardIntervals.forEach(clearInterval);
                    cardIntervals = [];

                    const fGrid = document.getElementById('featured-grid');
                    const dGrid = document.getElementById('daily-grid');
                    fGrid.innerHTML = '';
                    dGrid.innerHTML = '';

                    const featuredItems = data.featured || [];
                    const dailyItems = data.daily || [];

                    featuredItems.forEach(item => fGrid.appendChild(createCard(item)));
                    dailyItems.forEach(item => dGrid.appendChild(createCard(item)));

                    if (data.rotationInfo) {
                        const info = data.rotationInfo;

                        if (info.nextDailyRotationTimestamp) {
                            nextDailyTime = info.nextDailyRotationTimestamp * 1000;
                        } else if (info.nextDailyRotationUTC) {
                            nextDailyTime = new Date(info.nextDailyRotationUTC).getTime();
                        }

                        if (info.nextFeaturedRotationTimestamp) {
                            nextFeaturedTime = info.nextFeaturedRotationTimestamp * 1000;
                        } else if (info.nextFeaturedRotationUTC) {
                            nextFeaturedTime = new Date(info.nextFeaturedRotationUTC).getTime();
                        }
                    }

                    updateCountdown();
                })
                .catch(err => console.error('Error fetching shop:', err));
        }

        function createCard(item) {
            const card = document.createElement('div');
            const subItems = (item.items && item.items.length > 0) ? item.items : [item];
            
            let dotsHtml = '';
            if (subItems.length > 1) {
                dotsHtml = `<div class="card-dots">` + 
                    subItems.map((_, i) => `<span class="card-dot ${i === 0 ? 'active' : ''}" data-index="${i}"></span>`).join('') + 
                    `</div>`;
            }

            card.innerHTML = `
                <img class="item-image">
                ${dotsHtml}
                <div class="item-details">
                    <div class="item-name"></div>
                </div>
                <div class="price-container">
                    <span class="price-value"></span>
                    <img src="https://nextieria.ddns.net:45/Downloads/Images/Vbuck.png" class="vbucks-icon">
                </div>
            `;

            const imgEl = card.querySelector('.item-image');
            const nameEl = card.querySelector('.item-name');
            const priceEl = card.querySelector('.price-value');
            const dots = card.querySelectorAll('.card-dot');

            let currentIndex = 0;
            let timer = null;

            function updateDisplay(index) {
                const currentSub = subItems[index];
                const rarity = currentSub.rarity ? currentSub.rarity.replace(' ', '-') : (item.rarity ? item.rarity.replace(' ', '-') : 'Common');
                
                card.className = `item-card rarity-${rarity}`;
                imgEl.src = currentSub.image || item.image;
                nameEl.textContent = currentSub.name || currentSub.title || item.name || item.title;
                
                const currentPrice = (currentSub.price !== undefined && currentSub.price !== null) ? currentSub.price : item.price;
                priceEl.textContent = currentPrice;

                dots.forEach((dot, i) => {
                    dot.classList.toggle('active', i === index);
                });
            }

            function transitionTo(index) {
                if (currentIndex === index) return;
                currentIndex = index;
                imgEl.style.opacity = '0';
                nameEl.style.opacity = '0';
                
                setTimeout(() => {
                    updateDisplay(currentIndex);
                    imgEl.style.opacity = '1';
                    nameEl.style.opacity = '1';
                }, 300);
            }

            function startTimer() {
                if (subItems.length > 1) {
                    timer = setInterval(() => {
                        const nextIndex = (currentIndex + 1) % subItems.length;
                        transitionTo(nextIndex);
                    }, 5000);
                    cardIntervals.push(timer);
                }
            }

            function resetTimer() {
                if (timer) {
                    clearInterval(timer);
                    startTimer();
                }
            }

            updateDisplay(0);
            startTimer();

            dots.forEach(dot => {
                dot.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const targetIndex = parseInt(dot.getAttribute('data-index'), 10);
                    transitionTo(targetIndex);
                    resetTimer();
                });
            });

            return card;
        }

        function formatDiff(diff) {
            if (diff <= 0) return "REFRESHING...";

            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            const pad = (num) => String(num).padStart(2, '0');
            return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
        }

        function updateCountdown() {
            const now = Date.now();

            const dailyTimer = document.getElementById('daily-timer');
            if (dailyTimer && nextDailyTime) {
                dailyTimer.textContent = formatDiff(nextDailyTime - now);
            }

            const weeklyTimer = document.getElementById('weekly-timer');
            if (weeklyTimer && nextFeaturedTime) {
                weeklyTimer.textContent = formatDiff(nextFeaturedTime - now);
            }
        }

        fetchShop();
        setInterval(fetchShop, 30000);
        setInterval(updateCountdown, 1000);

    </script>
    <div id="footer"></div>
</body>
</html>
