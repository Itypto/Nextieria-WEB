<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nextieria Status</title>
<link rel="icon" type="image/x-icon" href="https://nextieria.ddns.net:45/Downloads/Other/NextieriaN.ico?v=a3bd85f6">
<style>
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d1117; color: #e6edf3; margin: 0; display: flex; }
#sidebar { width: 250px; padding: 20px; border-right: 1px solid #30363d; height: 100vh; position: fixed; background-color: #010409; }
#main-content { padding: 40px; margin-left: 290px; width: 100%; max-width: 800px; }
.home-link { display: block; margin-bottom: 20px; color: #8b949e; text-decoration: none; }
.item { margin: 15px 0; font-weight: bold; display: flex; justify-content: space-between; max-width: 400px; }
.status { padding: 2px 10px; border-radius: 4px; color: white; font-size: 0.9em; }
.online { background: #238636; }
.offline { background: #da3633; }
#msg-box { background: #161b22; padding: 20px; border-radius: 6px; border: 1px solid #30363d; margin-top: 30px; }
.contact-btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #58a6ff; color: #0d1117; text-decoration: none; border-radius: 5px; font-weight: bold; }
</style>
</head>
<body>
<div id="sidebar">
    <a href="https://nextieria.ddns.net" class="home-link">← Home</a>
    <a href="https://nextieria.ddns.net/news" class="home-link">News</a>
</div>
<div id="main-content">
    <h1>Server Status</h1>
    <div id="status-container"></div>
    <div id="msg-box">
        <h3 id="msg-title">Loading...</h3>
        <p id="msg-body">Fetching latest status updates...</p>
        <p><small id="msg-time"></small></p>
    </div>
    <a href="https://discord.com/users/ankagamer234" class="contact-btn">Want to report a issue?</a>
</div>
<script>
const services = [
{name: "Website", url: "https://nextieria.ddns.net", type: "ping"},
{name: "Backend", url: "https://nextieria.ddns.net:4372", type: "ping"},
{name: "Account/Login", url: "https://nextieria.ddns.net:81", type: "ping"},
{name: "XMPP", url: "https://nextieria.ddns.net:72", type: "ping"},
{name: "Database", url: "https://nextieria.ddns.net:81/launcher", type: "ping"},
{name: "Mobile Login", url: "https://nextieria.ddns.net:82", type: "ping"},
{name: "Nextieria CDN", url: "https://nextieria.ddns.net:45", type: "ping"},
{name: "Game Servers", url: "https://nextieria.ddns.net:81/gameserver", type: "json"}
];
async function check() {
const container = document.getElementById('status-container');
for (const s of services) {
let isUp = false;
try {
if(s.type === "ping") { await fetch(s.url, {mode: 'no-cors'}); isUp = true; }
else { const r = await fetch(s.url); const data = await r.json(); if(data.server1) isUp = true; }
} catch (e) { isUp = false; }
container.innerHTML += `<div class="item">${s.name}: <span class="status ${isUp ? 'online' : 'offline'}">${isUp ? 'Online' : 'Offline'}</span></div>`;
}
}
async function fetchInfo() {
const res = await fetch('https://nextieria.ddns.net:81/status');
const data = await res.json();
document.getElementById('msg-title').innerText = data.title;
document.getElementById('msg-body').innerText = data.message;
document.getElementById('msg-time').innerText = "Last Updated: " + data.timestamp;
}
check();
fetchInfo();
</script>
</body>
</html>
